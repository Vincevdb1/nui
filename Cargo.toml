[package]
name = "nui"
version = "0.1.0"
description = "A Terminal User Interface for the Nix package manager"
authors = ["Vincevdb1 <vincent.vandebosch@icloud.com>"]
license = "MIT"
edition = "2024"

[dependencies]
color-eyre = "0.6.3"
crossterm = "0.29.0"
ratatui = "0.30.0"
rnix = "0.14.0"
rowan = "0.16.1"
walkdir = "2.5.0"
nix-editor = "0.3.0"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
